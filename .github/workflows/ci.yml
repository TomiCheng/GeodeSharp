# =============================================================================
# CI is intentionally DISABLED during the MVP phases.
#
# Why:
#   - Directory.Build.props sets AnalysisLevel=latest-recommended +
#     TreatWarningsAsErrors=true. The Phase 0 skeleton itself fails on
#     opinionated analyzer rules (CA1848, CA1711, ...). Iterating "push,
#     watch CI go red, fix, push again" is not a useful feedback loop yet.
#   - No real production code exists. There is nothing to protect.
#
# When to re-enable:
#   - After analyzer strictness has been decided (relax to
#     latest-default for now? keep strict and pre-fix the skeleton? — see
#     issue tracker / CONTRIBUTING.md once the workflow is settled).
#   - At the latest, before Phase 5 / first NuGet preview release.
#
# To re-enable: uncomment the block below and push.
# =============================================================================

